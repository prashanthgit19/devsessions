name: CI DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install xcodegen

      - name: Verify
        run: make verify

      - name: Build test DMG
        run: |
          xcodegen generate
          DEVELOPER_ID_APPLICATION="-" ./scripts/package_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSessions-dmg-ci
          path: |
            dist/*.dmg
            dist/SHA256SUMS
